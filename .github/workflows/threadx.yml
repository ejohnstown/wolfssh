name: ThreadX Build Test

on:
  push:
    branches: [ 'release/**' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ '*' ]
  # Daily run on master reseeds the shared cache (see save step below).
  schedule:
    - cron: '20 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NETXDUO_REF: v6.4.3_rel
  WOLFSSL_REF: master

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Restore NetXDuo bundle cache
      id: cache-netxduo
      uses: actions/cache/restore@v5
      with:
        path: ./${{ env.NETXDUO_REF }}.tar.gz
        key: netxduo-bundle-${{ env.NETXDUO_REF }}

    - name: Download NetXDuo bundle if not cached
      if: steps.cache-netxduo.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/eclipse-threadx/netxduo/archive/refs/tags/${{ env.NETXDUO_REF }}.tar.gz

    # Only master (the daily schedule) saves, so all PRs share one entry.
    - name: Save NetXDuo bundle cache
      if: github.ref == 'refs/heads/master' && steps.cache-netxduo.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ./${{ env.NETXDUO_REF }}.tar.gz
        key: netxduo-bundle-${{ env.NETXDUO_REF }}

    - name: Extract NetXDuo bundle
      run: |
        mkdir -p netxduo_src
        tar -xzf ${{ env.NETXDUO_REF }}.tar.gz -C netxduo_src --strip-components=1

    - name: Configure NetX with DNS Client Support
      working-directory: ./netxduo_src
      run: |
        cp addons/dns/nxd_dns.h ./common/inc/
        cp addons/dns/nxd_dns.c ./common/src/

    # Don't use scripts/install.sh: it downloads ~600 MB of unneeded packages
    - name: Build NetXDuo with DNS Support
      working-directory: ./netxduo_src
      run: |
        rm -rf test/cmake/threadx
        rm -rf test/cmake/filex
        ./scripts/build_nxd64.sh

    - name: Set NetXDuo build flags
      run: |
        NX=${{ github.workspace }}/netxduo_src
        echo "NX_CPPFLAGS=-I$NX/common/inc -I$NX/ports/linux/gnu/inc -I$NX/test/cmake/netxduo64/build/libs/inc" >> $GITHUB_ENV
        echo "NX_LDFLAGS=-L$NX/test/cmake/netxduo64/build/default_build_coverage/netxduo -L$NX/test/cmake/netxduo64/build/libs/threadx" >> $GITHUB_ENV

    # wolfSSH links against this, so it is installed into build-dir.
    - name: Build and install wolfSSL
      uses: wolfSSL/actions-build-autotools-project@v1
      with:
        repository: wolfssl/wolfssl
        ref: ${{ env.WOLFSSL_REF }}
        path: wolfssl
        configure: --enable-ssh --enable-keygen --enable-enckeys --disable-examples --disable-benchmark --disable-crypttests CPPFLAGS="-DTHREADX -DHAVE_NETX -DWOLFSSL_USER_IO ${{ env.NX_CPPFLAGS }}" LDFLAGS="${{ env.NX_LDFLAGS }}" LIBS="-lnetxduo -lthreadx"
        check: false
        install: true

    - uses: actions/checkout@v6
      with:
        path: wolfssh/

    - name: autogen
      working-directory: ./wolfssh/
      run: ./autogen.sh

    # libthreadx.so leaves tx_application_define for the application to
    # supply, so any executable link (including configure's link probes)
    # fails without --allow-shlib-undefined. Build only; nothing is run.
    - name: configure
      working-directory: ./wolfssh/
      run: |
        ./configure --enable-keygen --enable-sftp --enable-scp --enable-fwd \
          --enable-agent --enable-certs --enable-keyboard-interactive \
          --disable-examples \
          CPPFLAGS="-I${{ github.workspace }}/build-dir/include -DTHREADX -DWOLFSSH_USER_IO $NX_CPPFLAGS" \
          LDFLAGS="-L${{ github.workspace }}/build-dir/lib $NX_LDFLAGS -Wl,--allow-shlib-undefined" \
          LIBS="-lnetxduo -lthreadx"

    # Build the library only. Under WOLFSSH_USER_IO the apps and examples
    # include a userio_template.h the port has to provide, and
    # --enable-fwd builds examples/portfwd even with --disable-examples.
    - name: make
      working-directory: ./wolfssh/
      run: make src/libwolfssh.la
