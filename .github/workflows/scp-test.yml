name: wolfSSH SCP Test

on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    # Daily reseed of the master-scoped wolfssl cache (staggered minute).
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_matrix:
    runs-on: ubuntu-latest
    outputs:
        versions: ${{ steps.json.outputs.versions }}
    steps:
      - name: Create wolfSSL version matrix
        id: json
        run: |
          current=`curl -s https://api.github.com/repos/wolfssl/wolfssl/releases | grep tag_name | cut -d : -f 2,3 | tr -d \" | tr -d , | tr -d ' ' | head -1`
          last=`curl -s https://api.github.com/repos/wolfssl/wolfssl/releases | grep tag_name | cut -d : -f 2,3 | tr -d \" | tr -d , | tr -d ' ' | head -2 | tail -1`
          VERSIONS=$(echo "[ \"master\", \"$current\", \"$last\" ]")
          echo "wolfSSL versions found: $VERSIONS"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  build_wolfssl:
    needs: create_matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        wolfssl: ${{ fromJson(needs.create_matrix.outputs['versions']) }}
    name: Build wolfssl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - name: Restore cache of wolfssl
        uses: actions/cache/restore@v5
        id: cache-wolfssl
        with:
          path: build-dir/
          key: wolfssh-sshd-wolfssl-${{ matrix.wolfssl }}-${{ matrix.os }}-v3

      - name: Checkout, build, and install wolfssl
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        uses: wolfSSL/actions-build-autotools-project@v1
        with:
          repository: wolfssl/wolfssl
          ref: ${{ matrix.wolfssl }}
          path: wolfssl
          configure: --enable-all
          check: false
          install: true

      # Caches are branch-scoped: only the master entry is shared with all PRs.
      # Save solely on master (and the scheduled master run) to seed that entry.
      - name: Save cache of wolfssl
        if: github.ref == 'refs/heads/master' && steps.cache-wolfssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build-dir/
          key: wolfssh-sshd-wolfssl-${{ matrix.wolfssl }}-${{ matrix.os }}-v3

      # On a non-master cache miss nothing is saved, so hand the fresh build to
      # the downstream job via an artifact instead.
      - name: Upload wolfssl build artifact (cache-miss fallback)
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wolfssl-build-scp-${{ matrix.wolfssl }}-${{ matrix.os }}
          path: build-dir/
          retention-days: 1

  build_wolfssh:
    needs:
      - build_wolfssl
      - create_matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        wolfssl: ${{ fromJson(needs.create_matrix.outputs['versions']) }}
    name: Build and test wolfsshd
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Restore cache of wolfssl
        uses: actions/cache/restore@v5
        id: cache-wolfssl
        with:
          path: build-dir/
          key: wolfssh-sshd-wolfssl-${{ matrix.wolfssl }}-${{ matrix.os }}-v3

      - name: Download wolfssl build artifact (cache-miss fallback)
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: wolfssl-build-scp-${{ matrix.wolfssl }}-${{ matrix.os }}
          path: build-dir/

      - uses: actions/checkout@v6
        with:
          path: wolfssh/

      - name: autogen
        working-directory: ./wolfssh/
        run: ./autogen.sh

      - name: configure
        working-directory: ./wolfssh/
        run : |
          ./configure --enable-all LDFLAGS="-L${{ github.workspace }}/build-dir/lib" CPPFLAGS="-I${{ github.workspace }}/build-dir/include -DWOLFSSH_NO_FPKI -DWOLFSSH_NO_SFTP_TIMEOUT -DMAX_PATH_SZ=120"

      - name: make
        working-directory: ./wolfssh/
        run: make

      - name: Setup test user
        run: sudo useradd -p password jak

      # This is a regression test for a reported hang with SCP file transfer.
      #     Verifying the error from a bad directory is propogated back, and
      #     that the direcotry/file is not created. To account for potential
      #     hanging of the operation, the timeout is set to 1 minute.
      - name: Run SCP example test
        timeout-minutes: 1
        working-directory: ./wolfssh/
        run: |
          mkdir /tmp/wolfssh
          echo "test file" > /tmp/wolfssh/test.txt
          ./examples/scpclient/wolfscp -p 22 -u jak -P password -H 127.0.0.1  -L /tmp/wolfssh/test.txt:/tmp/non_existent_folder/ || true
          # check that the directory and file do not exist
          [ ! -d /tmp/non_existent_folder ]
          [ ! -f /tmp/non_existent_folder/test.txt ]
